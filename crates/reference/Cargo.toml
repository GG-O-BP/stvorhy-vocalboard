[package]
name = "vocalboard-reference"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Reference tracks: import, decode, vocal separation, pitch extraction"

[dependencies]
flacenc = "=0.5.1"
ort = "=2.0.0-rc.12"
realfft = "=3.5.0"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2 = "=0.11.0"
symphonia = { version = "=0.6.0", features = ["aac", "isomp4", "mp3", "flac", "wav", "ogg", "vorbis"] }
thiserror = { workspace = true }
ureq = "=3.3.0"
vocalboard-codec = { workspace = true }
vocalboard-dsp = { workspace = true }

[dev-dependencies]
hound = "=3.5.1"
tempfile = "=3.27.0"
